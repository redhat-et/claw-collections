name: Validate Bundles

on:
  pull_request:
    paths:
      - "claw-bundles/**"
  push:
    branches: [main]
    paths:
      - "claw-bundles/**"

permissions:
  contents: read

jobs:
  catalog:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    defaults:
      run:
        working-directory: claw-bundles
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 24.15.0
          cache: npm
          cache-dependency-path: claw-bundles/package-lock.json
      - run: npm ci
      - run: npm run check
