apiVersion: claw.sandbox.redhat.com/v1alpha1
kind: Claw
metadata:
  name: project-assistant
spec:
  version: "2026.6.11"
  credentials:
    - name: anthropic-vertex
      type: gcp
      secretRef:
        - name: vertex-sa-key
          key: sa-key.json
      gcp:
        project: "itpc-gcp-octo-eng-claude"
        location: "global"
      provider: anthropic
    # GitHub API credential
    - name: github
      type: bearer
      domain: api.github.com
      secretRef:
        - name: github-pat
          key: token
      allowedPaths:
        - /repos/
        - /user
  agentFiles:
    git:
      url: https://github.com/redhat-et/claw-collections.git
      ref: main
      path: enterprise-profiles/project-assistant
    readOnly:
      - SOUL.md
      - TOOLS.md
